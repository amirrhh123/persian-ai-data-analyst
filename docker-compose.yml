version: '3.8'

services:
  api:
    build: .
    container_name: persian_ai_api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-persian_ai_db}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_CONTEXT_MAX_TOKENS: ${LLM_CONTEXT_MAX_TOKENS:-8192}
      LLM_RESERVED_OUTPUT_TOKENS: ${LLM_RESERVED_OUTPUT_TOKENS:-1024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TENANT_ID: ${TENANT_ID:-education_ministry}
      EMBEDDING_MODEL_PATH: /app/models/paraphrase-multilingual-mpnet-base-v2
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    volumes:
      - ./models:/app/models:ro
      - ./knowledge:/app/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: persian_ai_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-persian_ai_db}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DATABASE_NAME:-persian_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    container_name: persian_ai_chromadb
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  chroma_data:
