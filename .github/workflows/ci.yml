name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality-gate:
    name: Offline quality gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall -q backend

      - name: Run offline regression tests
        run: >-
          python -m pytest
          tests/test_incremental_auto_sync.py
          tests/test_citation_service.py
          tests/test_sql_repair_loop.py
          tests/test_query_decomposition.py
          tests/test_confidence_gate.py
          tests/test_reranker.py
          tests/test_hybrid_retrieval.py
          tests/test_value_index.py
          tests/test_generic_table_alias_routing.py
          -q
