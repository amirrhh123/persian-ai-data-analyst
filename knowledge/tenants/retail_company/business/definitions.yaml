definitions:
  - id: فروش_خالص
    term: فروش خالص
    definition: مجموع فروش پس از کسر تخفیف‌ها و مرجوعی‌ها
    category: مالی
    
  - id: موجودی_انبار
    term: موجودی انبار
    definition: تعداد کالاهای موجود در انبار در هر لحظه
    category: انبارداری
    
  - id: نرخ_گردش_موجودی
    term: نرخ گردش موجودی
    definition: تعداد دفعات فروش و جایگزینی موجودی در یک دوره زمانی
    category: مالی
    
  - id: حاشیه_سود
    term: حاشیه سود
    definition: درصد سود خالص نسبت به فروش خالص
    category: مالی
    
  - id: ارزش_سبد_خرید
    term: ارزش سبد خرید
    definition: متوسط مبلغ خرید هر مشتری در هر نوبت
    category: فروش
