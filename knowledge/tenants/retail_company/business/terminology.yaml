terminology:
  - term: فاکتور
    meaning: سند فروش حاوی جزئیات خرید مشتری
    synonyms:
      - صورتحساب
      - رسید
      
  - term: کد کالا
    meaning: شناسه یکتای هر محصول در سیستم
    synonyms:
      - کد محصول
      - بارکد
      
  - term: چیدمان
    meaning: نحوه قرارگیری محصولات در فروشگاه
    synonyms:
      - دیسپلین
      - ویترین‌بندی
      
  - term: پیکربندی
    meaning: تنظیمات و پارامترهای سیستم
    synonyms:
      - تنظیمات
      - کانفیگ
      
  - term: سبد خرید
    meaning: مجموع کالاهای انتخاب شده توسط مشتری برای خرید
    synonyms:
      - سبد کالا
      - لیست خرید
