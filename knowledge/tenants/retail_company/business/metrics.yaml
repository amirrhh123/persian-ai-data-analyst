metrics:
  - id: فروش_روزانه
    name: فروش روزانه
    formula: SUM(مبلغ_فروش) در هر روز
    unit: ریال
    target: ۵۰۰,۰۰۰,۰۰۰
    frequency: روزانه
    
  - id: نرخ_تبدیل
    name: نرخ تبدیل بازدیدکننده به خریدار
    formula: (تعداد خریداران / تعداد بازدیدکنندگان) × ۱۰۰
    unit: درصد
    target: ۲۵٪
    frequency: روزانه
    
  - id: میانگین_ارزش_سفارش
    name: میانگین ارزش سفارش
    formula: مجموع فروش / تعداد سفارشات
    unit: ریال
    target: ۲,۰۰۰,۰۰۰
    frequency: هفتگی
    
  - id: نرخ_مرجوعی
    name: نرخ مرجوعی
    formula: (تعداد مرجوعی / تعداد فروش) × ۱۰۰
    unit: درصد
    target: کمتر از ۵٪
    frequency: ماهانه
    
  - id: رضایت_مشتری
    name: شاخص رضایت مشتری
    formula: میانگین امتیازات نظرسنجی
    unit: امتیاز (از ۵)
    target: ۴.۵
    frequency: ماهانه
