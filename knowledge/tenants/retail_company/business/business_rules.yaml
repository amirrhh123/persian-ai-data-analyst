rules:
  - id: قانون_تخفیف
    name: قانون اعمال تخفیف
    description: حداکثر تخفیف مجاز برای محصولات
    condition: اگر مبلغ خرید بیشتر از ۵,۰۰۰,۰۰۰ ریال باشد
    action: تخفیف ۱۰ درصدی اعمال می‌شود
    priority: متوسط
    
  - id: قانون_مرجوعی
    name: قانون مرجوعی کالا
    description: شرایط مرجوعی کالا
    condition: حداکثر ۷ روز پس از خرید
    action: مرجوعی با ارائه فاکتور امکان‌پذیر است
    priority: بالا
    
  - id: قانون_انبار
    name: قانون مدیریت انبار
    description: حداقل موجودی مجاز
    condition: اگر موجودی کمتر از ۱۰ عدد باشد
    action: هشدار سفارش مجدد ارسال می‌شود
    priority: بالا
    
  - id: قانون_فروشندگان
    name: قانون عملکرد فروشندگان
    description: پاداش فروشندگان بر اساس عملکرد
    condition: اگر فروش ماهانه بیش از هدف باشد
    action: پاداش ۵ درصدی از مبلغ فروش اضافه
    priority: پایین
    
  - id: قانون_محصولات_جدید
    name: قانون معرفی محصولات جدید
    description: تخفیف ویژه محصولات جدید
    condition: ۳۰ روز اول پس از ورود محصول
    action: تخفیف ۱۵ درصدی اعمال می‌شود
    priority: متوسط
