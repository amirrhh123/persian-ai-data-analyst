rules:
  - id: قانون_بازنشستگی
    name: قانون بازنشستگی
    description: شرایط بازنشستگی کارکنان
    condition: پس از ۳۰ سال خدمت یا سن ۶۵ سال
    action: بازنشستگی اجباری
    priority: بالا
    sql_note: "فقط کارکنان فعال را در نظر بگیر"
    
  - id: قانون_ارتقا
    name: قانون ارتقای رتبه
    description: شرایط ارتقای رتبه کارکنان
    condition: حداقل ۳ سال سابقه در رتبه فعلی
    action: امکان درخواست ارتقا
    priority: متوسط
    sql_note: "درخواست‌های pending را جداگانه نشان بده"
    
  - id: قانون_حقوق
    name: قانون پرداخت حقوق
    description: زمان‌بندی پرداخت حقوق
    condition: پایان هر ماه شمسی
    action: واریز حقوق تا ۲۸ ماه
    priority: بالا
    sql_note: "فقط پرداخت‌های تایید شده را لحاظ کن"
    
  - id: قانون_مرخصی
    name: قانون مرخصی
    description: شرایط استفاده از مرخصی
    condition: ۳۰ روز مرخصی سالانه
    action: امکان استفاده با تایید مدیر
    priority: متوسط
    sql_note: ""
    
  - id: قانون_آموزش
    name: قانون آموزش
    description: الزامات آموزشی کارکنان
    condition: هر ۲ سال یکبار
    action: شرکت در دوره‌های آموزشی
    priority: پایین
    sql_note: ""
