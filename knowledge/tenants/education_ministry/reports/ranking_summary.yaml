id: ranking_summary
name: خلاصه درخواست‌های ارتقا
description: گزارش وضعیت درخواست‌های ارتقای رتبه
linked_table: ranking_requests
group_id: ranking
allowed_metrics:
  - نرخ_ارتقا
business_rules:
  - قانون_ارتقا
example_questions:
  - درخواست‌های pending
  - درخواست‌های تایید شده
  - درخواست‌های رد شده
  - میانگین زمان بررسی
important_columns:
  employee_id:
    meaning: شناسه کارمند
    persian_name: کد کارمند
    data_type: integer
  request_date:
    meaning: تاریخ درخواست
    persian_name: تاریخ
    data_type: date
  ranking_type:
    meaning: نوع ارتقا
    persian_name: نوع
    data_type: varchar
  current_rank:
    meaning: رتبه فعلی
    persian_name: رتبه فعلی
    data_type: varchar
  requested_rank:
    meaning: رتبه درخواستی
    persian_name: رتبه درخواستی
    data_type: varchar
  status:
    meaning: وضعیت درخواست
    persian_name: وضعیت
    data_type: varchar
sql_hints:
  default_filters: []
  preferred_joins:
    - "ranking_requests.employee_id = employees.id"
  aggregate_columns: []
  group_by_columns:
    - status
    - ranking_type
