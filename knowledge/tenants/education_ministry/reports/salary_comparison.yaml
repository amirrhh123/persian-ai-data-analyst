id: salary_comparison
name: مقایسه حقوق بخش‌ها
description: گزارش مقایسه‌ای حقوق کارکنان در بخش‌های مختلف
linked_table: salary_items
group_id: salary
allowed_metrics:
  - میانگین_حقوق
business_rules:
  - قانون_حقوق
example_questions:
  - مقایسه حقوق بخش‌های مختلف
  - تفاوت حقوق استان‌ها
  - حقوق مدیران نسبت به کارشناسان
important_columns:
  employee_id:
    meaning: شناسه کارمند
    persian_name: کد کارمند
    data_type: integer
  net_salary:
    meaning: خالص پرداختی
    persian_name: خالص حقوق
    data_type: decimal
sql_hints:
  default_filters: []
  preferred_joins:
    - "salary_items.employee_id = employees.id"
    - "employees.organization_unit_id = organization_units.id"
  aggregate_columns:
    - net_salary
  group_by_columns:
    - organization_units.name
