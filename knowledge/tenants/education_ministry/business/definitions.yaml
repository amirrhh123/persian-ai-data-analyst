definitions:
  - id: کارمند
    term: کارمند
    definition: فردی که در وزارت آموزش و پرورش مشغول به کار است
    category: منابع انسانی
    
  - id: واحد_سازمانی
    term: واحد سازمانی
    definition: بخش یا واحد تشکیلاتی در ساختار سازمانی
    category: سازمانی
    
  - id: رتبه
    term: رتبه
    definition: درجه شغلی کارمند بر اساس سابقه و مدرک
    category: منابع انسانی
    
  - id: مدرسه
    term: مدرسه
    definition: محل آموزش دانش‌آموزان
    category: آموزشی
    
  - id: دانش_آموز
    term: دانش‌آموز
    definition: فردی که در مدرسه مشغول تحصیل است
    category: آموزشی
